name: Notebook CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert ipykernel

      - name: Execute notebook end-to-end
        run: |
          mkdir -p artifacts
          jupyter nbconvert             --to notebook             --execute Interpretabilidad_de_Scoring_Crediticio.ipynb             --output artifacts/Interpretabilidad_de_Scoring_Crediticio.executed.ipynb             --ExecutePreprocessor.timeout=2400

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-scoring-notebook
          path: artifacts/Interpretabilidad_de_Scoring_Crediticio.executed.ipynb
          if-no-files-found: warn
